version: 2

models:
  - name: stg_orders
    description: Órdenes crudas de Olist con tipos limpios. Una fila por orden.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
  - name: stg_order_items
    description: Líneas de orden. Una fila por producto dentro de una orden.
    data_tests:
      - unique_combination:
          arguments:
            columns: [order_id, order_item_id]
  - name: stg_customers
    description: Un customer_id por orden; customer_unique_id identifica a la persona.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: stg_products
    description: Productos con la categoría traducida al inglés.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
  - name: stg_sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]
  - name: stg_payments
    description: Pagos por orden (una orden puede pagarse con varios medios).
  - name: stg_reviews
    description: Última reseña de cada orden.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: review_score
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
